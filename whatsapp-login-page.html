<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #25D366;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 42px;
            font-weight: bold;
        }

        h1 {
            color: #111;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #667781;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd0d5;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #25D366;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #25D366;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #20bd5a;
        }

        .forgot {
            display: block;
            margin: 18px 0;
            color: #128C7E;
            text-decoration: none;
            font-size: 14px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #999;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .divider span {
            padding: 0 10px;
        }

        .signup-btn {
            width: 100%;
            padding: 12px;
            border: 1px solid #25D366;
            border-radius: 7px;
            background: white;
            color: #128C7E;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup-btn:hover {
            background: #f0fff5;
        }

        .message {
            margin-top: 20px;
            font-size: 14px;
            display: none;
        }

        .footer {
            margin-top: 25px;
            color: #8696a0;
            font-size: 12px;
        }

        @media (max-width: 450px) {
            .login-container {
                width: 90%;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">☎</div>

        <h1>WhatsApp</h1>

        <p class="subtitle">
            Log in to continue to WhatsApp
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                    maxlength="10"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Log In
            </button>

        </form>

        <a href="#" class="forgot" onclick="forgotPassword()">
            Forgot Password?
        </a>

        <div class="divider">
            <span>OR</span>
        </div>

        <button class="signup-btn" onclick="createAccount()">
            Create New Account
        </button>

        <p class="message" id="message"></p>

        <div class="footer">
            © 2026 WhatsApp Login Demo
        </div>

    </div>

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const phone = document.getElementById("phone").value;
            const password = document.getElementById("password").value;

            if (phone.length !== 10) {
                showMessage("Please enter a valid 10-digit phone number.", "red");
                return;
            }

            if (password.length < 6) {
                showMessage("Password must contain at least 6 characters.", "red");
                return;
            }

            // Demo only — no credentials are stored or sent.
            showMessage("Login successful! This is a demo page.", "green");
        });

        function forgotPassword() {
            showMessage("Password reset feature is available in the demo.", "blue");
        }

        function createAccount() {
            showMessage("Account registration page can be added here.", "blue");
        }

        function showMessage(text, color) {
            message.textContent = text;
            message.style.color = color;
            message.style.display = "block";
        }
    </script>

</body>
</html>
