<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Audio Message</title>

    <style>
        * {
            margin: 0;

            font-family: Arial, sans-serif;
        }

<body>

<div class="chat">

    <!-- Header -->
    <div class="header">
        <div class="profile">👤</div>

        <div>
            <h3>Friend</h3>
            <p>online</p>
        </div>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">

        <div class="message">

            <div class="audio-row">

                <button class="play-btn" onclick="playAudio()">
                    ▶
                </button>

                <div class="audio-info">

                    <div class="wave">
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                    </div>

                    <span class="duration" id="duration">
                        0:00
                    </span>

                </div>

            </div>

            <div class="time">
                4:30 PM ✓✓
            </div>

        </div>

    </div>

    <!-- Recording Controls -->
    <div class="controls">

        <button
            class="record-btn"
            id="recordBtn"
            onclick="startRecording()">
            🎙️
        </button>

        <button
            class="stop-btn"
            onclick="stopRecording()">
            ⏹
        </button>

    </div>

    <div class="status" id="status">
        Tap microphone to record
    </div>

</div>


<script>

    let recorder;
    let audioChunks = [];
    let audioURL;
    let audio;

    async function startRecording() {

        try {

            const stream =
                await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

            recorder = new MediaRecorder(stream);

            audioChunks = [];

            recorder.ondataavailable = function(event) {

                audioChunks.push(event.data);

            };

            recorder.onstop = function() {

                const audioBlob =
                    new Blob(audioChunks, {
                        type: "audio/webm"
                    });

                audioURL = URL.createObjectURL(audioBlob);

                audio = new Audio(audioURL);

                document.getElementById("status").innerText =
                    "Recording ready. Tap ▶ to play.";

                document.getElementById("recordBtn")
                    .classList.remove("recording");

            };

            recorder.start();

            document.getElementById("recordBtn")
                .classList.add("recording");

            document.getElementById("status").innerText =
                "Recording...";

        }

        catch (error) {

            document.getElementById("status").innerText =
                "Microphone permission denied.";

        }
    }


    function stopRecording() {

        if (recorder && recorder.state !== "inactive") {

            recorder.stop();

        }

    }


    function playAudio() {

        if (audio) {

            audio.play();

            document.getElementById("status").innerText =
                "Playing audio...";

            audio.onended = function() {

                document.getElementById("status").innerText =
                    "Audio finished.";

            };

        } else {

            document.getElementById("status").innerText =
                "Record an audio message first.";

        }

    }

</script>

</body>
</html>
