
```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Chat</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #d9dbd5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 420px;
            height: 650px;
            background: #efeae2;
            display: flex;
            flex-direction: column;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            height: 65px;
            background: #075e54;
            color: white;
            display: flex;
            align-items: center;
            padding: 10px 15px;
        }

        .profile {
            width: 45px;
            height: 45px;
            background: #ddd;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            font-size: 20px;
            margin-right: 12px;
        }

        .user-info h3 {
            font-size: 16px;
        }

        .user-info p {
            font-size: 12px;
            color: #d8f8f5;
            margin-top: 3px;
        }

        /* Messages */
        .messages {
            flex: 1;
            padding: 20px 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 75%;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 14px;
            position: relative;
            word-wrap: break-word;
        }

        .received {
            align-self: flex-start;
            background: white;
            border-top-left-radius: 0;
        }

        .sent {
            align-self: flex-end;
            background: #d9fdd3;
            border-top-right-radius: 0;
        }

        .time {
            display: block;
            text-align: right;
            font-size: 10px;
            color: #667781;
            margin-top: 4px;
        }

        /* Input area */
        .input-area {
            min-height: 65px;
            background: #f0f2f5;
            display: flex;
            align-items: center;
            padding: 10px;
            gap: 8px;
        }

        .input-area input {
            flex: 1;
            border: none;
            outline: none;
            padding: 12px 15px;
            border-radius: 25px;
            font-size: 14px;
        }

        .send-btn {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: #25d366;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .send-btn:hover {
            background: #128c7e;
        }

        @media (max-width: 500px) {
            .chat-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <div class="chat-header">

            <div class="profile">
                👤
            </div>

            <div class="user-info">
                <h3>Friend</h3>
                <p id="status">online</p>
            </div>

        </div>

        <!-- Messages -->
        <div class="messages" id="messages">

            <div class="message received">
                Hi! 👋
                <span class="time">10:30 AM</span>
            </div>

            <div class="message received">
                How are you?
                <span class="time">10:31 AM</span>
            </div>

            <div class="message sent">
                I'm good 😊
                <span class="time">10:32 AM</span>
            </div>

        </div>

        <!-- Message Input -->
        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                autocomplete="off"
            >

            <button class="send-btn" onclick="sendMessage()">
                ➤
            </button>

        </div>

    </div>

    <script>

        const input = document.getElementById("messageInput");
        const messages = document.getElementById("messages");

        function getTime() {

            const now = new Date();

            return now.toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function sendMessage() {

            const text = input.value.trim();

            if (text === "") {
                return;
            }

            // Create sent message
            const message = document.createElement("div");

            message.className = "message sent";

            message.innerHTML = `
                ${escapeHTML(text)}
                <span class="time">${getTime()}</span>
            `;

            messages.appendChild(message);

            input.value = "";

            // Scroll to bottom
            messages.scrollTop = messages.scrollHeight;

            // Demo auto reply
            setTimeout(() => {

                const reply = document.createElement("div");

                reply.className = "message received";

                reply.innerHTML = `
                    Thanks for your message! 😊
                    <span class="time">${getTime()}</span>
                `;

                messages.appendChild(reply);

                messages.scrollTop = messages.scrollHeight;

            }, 1000);
        }

        // Send message when Enter is pressed
        input.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        });

        // Prevent HTML injection in demo messages
        function escapeHTML(text) {

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;
        }

    </script>

</body>
</html>
