```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Status</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #d9dbd5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 420px;
            height: 650px;
            background: #f7f9fa;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
        }

        /* Header */

        .header {
            height: 65px;
            background: #075e54;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
        }

        .header h2 {
            font-size: 21px;
        }

        .menu {
            font-size: 25px;
            cursor: pointer;
        }

        /* Section */

        .section-title {
            padding: 15px;
            color: #667781;
            font-size: 14px;
            font-weight: bold;
            background: #f0f2f5;
        }

        /* Status item */

        .status-item {
            display: flex;
            align-items: center;
            padding: 13px 15px;
            background: white;
            cursor: pointer;
        }

        .status-item:hover {
            background: #f5f5f5;
        }

        .profile-wrapper {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            padding: 3px;
            margin-right: 14px;
        }

        .unseen {
            border: 3px solid #25d366;
        }

        .seen {
            border: 3px solid #8696a0;
        }

        .profile {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        .add-icon {
            position: absolute;
            width: 22px;
            height: 22px;
            margin-left: 40px;
            margin-top: 38px;
            background: #25d366;
            color: white;
            border-radius: 50%;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }

        .status-info h3 {
            font-size: 16px;
            color: #111;
            margin-bottom: 5px;
        }

        .status-info p {
            font-size: 13px;
            color: #667781;
        }

        /* Status grid */

        .status-list {
            background: white;
        }

        /* Status viewer */

        .viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: #111;
            z-index: 10;
            justify-content: center;
            align-items: center;
        }

        .viewer img {
            max-width: 100%;
            max-height: 90%;
            object-fit: contain;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: white;
            font-size: 30px;
            cursor: pointer;
        }

        .viewer-name {
            position: absolute;
            top: 25px;
            left: 25px;
            color: white;
            font-size: 16px;
        }

        /* Add status */

        .add-status {
            position: absolute;
            bottom: 25px;
            right: 25px;
            width: 55px;
            height: 55px;
            border: none;
            border-radius: 50%;
            background: #25d366;
            color: white;
            font-size: 25px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        input[type="file"] {
            display: none;
        }

        @media (max-width: 500px) {
            body {
                align-items: stretch;
            }

            .app {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- Header -->

    <div class="header">
        <h2>Status</h2>
        <div class="menu">⋮</div>
    </div>


    <!-- My Status -->

    <div class="section-title">
        My Status
    </div>

    <div class="status-item" onclick="addStatus()">

        <div class="profile-wrapper seen">
            <div class="profile">
                👤
            </div>

            <div class="add-icon">
                +
            </div>
        </div>

        <div class="status-info">
            <h3>My Status</h3>
            <p>Tap to add status update</p>
        </div>

    </div>


    <!-- Recent Updates -->

    <div class="section-title">
        Recent updates
    </div>

    <div class="status-list">

        <!-- Status 1 -->

        <div class="status-item"
             onclick="openStatus('Friend 1')">

            <div class="profile-wrapper unseen">

                <div class="profile">
                    👩
                </div>

            </div>

            <div class="status-info">
                <h3>Friend 1</h3>
                <p>5 minutes ago</p>
            </div>

        </div>


        <!-- Status 2 -->

        <div class="status-item"
             onclick="openStatus('Friend 2')">

            <div class="profile-wrapper unseen">

                <div class="profile">
                    👨
                </div>

            </div>

            <div class="status-info">
                <h3>Friend 2</h3>
                <p>20 minutes ago</p>
            </div>

        </div>


        <!-- Status 3 -->

        <div class="status-item"
             onclick="openStatus('Friend 3')">

            <div class="profile-wrapper seen">

                <div class="profile">
                    👩‍💻
                </div>

            </div>

            <div class="status-info">
                <h3>Friend 3</h3>
                <p>1 hour ago</p>
            </div>

        </div>

    </div>


    <!-- Add Status -->

    <input
        type="file"
        id="statusFile"
        accept="image/*,video/*"
        onchange="uploadStatus(event)"
    >

    <button
        class="add-status"
        onclick="addStatus()">
        +
    </button>

</div>


<!-- Status Viewer -->

<div class="viewer" id="viewer">

    <div class="viewer-name" id="viewerName">
        Friend
    </div>

    <div class="close" onclick="closeStatus()">
        ×
    </div>

    <img
        id="statusImage"
        src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
        alt="Status"
    >

</div>


<script>

    function addStatus() {

        document.getElementById("statusFile").click();

    }


    function uploadStatus(event) {

        const file = event.target.files[0];

        if (!file) {
            return;
        }

        const url = URL.createObjectURL(file);

        const viewer = document.getElementById("viewer");

        const image = document.getElementById("statusImage");

        image.src = url;

        document.getElementById("viewerName").innerText =
            "My Status";

        viewer.style.display = "flex";

    }


    function openStatus(name) {

        document.getElementById("viewerName").innerText =
            name;

        document.getElementById("viewer").style.display =
            "flex";

    }


    function closeStatus() {

        document.getElementById("viewer").style.display =
            "none";

    }

</script>

</body>
</html>
```
